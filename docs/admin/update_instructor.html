<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instructor Form</title>
    <link rel="stylesheet" href="../css/admin.css">
    <link rel="stylesheet" href="../css/demo.css">
    <script src="../js/db.js"></script>
    <script src="../js/admin.js"></script>
</head>

<body>
    <section id="navigation"></section>
    <form id="instructor_form">
        <fieldset>
            <legend>Instructor Form</legend>

            <label>Name:</label>
            <input type="text" name="name" placeholder="enter name" required>
            <label>role:</label>
            <input type="text" name="role" placeholder="enter role" required>
            <label>details</label>
            <input type="text" name="details" placeholder="enter details" required>
            <label>image link</label>
            <input type="text" name="image" placeholder="enter image" required>

            <button type="submit">Submit</button>
        </fieldset>
    </form>

    <script>
        renderAdminNavbar();

        var id = getParam("id");
        var row = findById(getTable("instructors"), id);
        if (row) {
            fillForm(row);
        } else {
            window.location.href = "instructor.html";
        }

        document.getElementById("instructor_form").onsubmit = function (e) {
            e.preventDefault();

            var data = readForm(["name", "role", "details", "image"]);
            updateRow("instructors", id, data);
            window.location.href = "instructor.html";
        };
    </script>
</body>

</html>
