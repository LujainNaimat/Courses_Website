<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Package</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/admin.css">
    <link rel="stylesheet" href="../css/demo.css">
    <script src="../js/db.js"></script>
    <script src="../js/admin.js"></script>
</head>

<body>
    <section id="navigation"></section>
    <button type="button" class="btn btn-primary btn-lg"><a href="add_package.html">Add Package</a></button>

    <section class="package">
        <div class="table-scroll">
        <table>
            <thead>
            <tr>
                <th>Name</th>
                <th>Details</th>
                <th>price</th>
                <th id="action_col">Actions</th>
            </tr>
            </thead>
            <tbody id="rows"></tbody>
        </table>
        </div>
    </section>

    <script>
        renderAdminNavbar();

        var rows = getTable("packages");

        renderAdminTable("packages", rows, [{ key: "name" }, { key: "details" }, { key: "price", suffix: " JD" }], "update_package.html");
    </script>
</body>

</html>
