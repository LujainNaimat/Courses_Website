<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/styleregister.css">
    <link rel="stylesheet" href="css/demo.css">
    <script src="js/db.js"></script>
</head>

<body>
    <div class="register_container">
        <legend>Sign in</legend>
        <form id="signin_form">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>
            <br><br>
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required>
            <br><br>

            <button type="submit" name="sign_in">Sign in</button>
        </form>

        <div class="demo-accounts">
            <b>Demo accounts</b><br>
            Student: student@smarttraining.com / student123<br>
            Admin: admin@smarttraining.com / admin123<br>
            <button type="button" onclick="fillDemo('student@smarttraining.com', 'student123')">Use student</button>
            <button type="button" onclick="fillDemo('admin@smarttraining.com', 'admin123')">Use admin</button>
        </div>
    </div>

    <button><a href="signup.html">Dont have an account?</a></button>
    <p><a href="index.html">Back to home</a></p>

    <script>
        function fillDemo(email, password) {
            document.getElementById("email").value = email;
            document.getElementById("password").value = password;
        }

        document.getElementById("signin_form").onsubmit = function (e) {
            e.preventDefault();

            var email = document.getElementById("email").value;
            var password = document.getElementById("password").value;

            // SELECT * FROM users WHERE email = ... AND password = ...
            var users = getTable("users");
            var row = null;
            for (var i = 0; i < users.length; i++) {
                if (users[i].email == email && users[i].password == password) {
                    row = users[i];
                }
            }

            if (row) {
                setSession({ student: row.fname, email: row.email, role: row.role });

                // redirect to home page according to role
                if (row.role == "admin") {
                    window.location.href = "admin/home.html";
                } else {
                    window.location.href = "index.html";
                }
            } else {
                alert("Invalid Email or password");
            }
        };
    </script>
</body>

</html>
